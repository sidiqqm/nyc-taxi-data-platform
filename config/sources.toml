[paths]
# Local Bronze root. In the GCS stage the same relative layout becomes the object key.
bronze_dir = "data/bronze"

[http]
timeout_seconds = 60
max_attempts = 4
backoff_base_seconds = 2.0
# Statuses that mean "this file is not published (yet)" rather than "something broke".
not_available_statuses = [403, 404]
user_agent = "nyc-taxi-data-platform/0.1 (learning project)"

[sources.yellow]
kind = "monthly"
file_format = "parquet"
url_template = "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{period}.parquet"

[sources.taxi_zone_lookup]
kind = "reference"
file_format = "csv"
url_template = "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"
required_columns = ["LocationID", "Borough", "Zone", "service_zone"]